name: Publish SDK to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Get and verify release tarball
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TARBALL="dim-sdk-${VERSION}.tgz"
          gh release download "v${VERSION}" --pattern "$TARBALL" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum --check SHA256SUMS
          echo "tarball=$RUNNER_TEMP/$TARBALL" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$TARBALL" --access public
